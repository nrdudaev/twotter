[package]
name = "twitter-iced"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.32"
iced = "0.14.0"
rand = "0.10.1"
redis = { version = "1.2.1", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"]}
serde_derive = "1.0.228"
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["macros", "local-offset"] }
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = "0.7.18"
uuid = { version = "1.24.1", features = ["v4"] }
